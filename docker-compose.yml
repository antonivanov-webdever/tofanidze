services:
  app:
    build:
      context: .
      target: runtime
    image: tofanidze-portfolio:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      # Required: an env var Compose sets to "" still counts as "set" to
      # Laravel's Dotenv, which then won't load whatever entrypoint.sh's own
      # key:generate fallback writes to .env — artisan commands won't notice,
      # only real HTTP requests will, once cookie encryption needs a key that
      # was never actually there. Generate one: echo "base64:$(openssl rand -base64 32)"
      APP_KEY: ${APP_KEY:?set a generated key, e.g. echo "base64:$(openssl rand -base64 32)"}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-portfolio}
      DB_USERNAME: ${DB_USERNAME:-portfolio}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-site@localhost}
    volumes:
      - storage:/var/www/html/storage
      - public:/var/www/html/public
    networks: [web]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [web]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-portfolio}
      MYSQL_USER: ${DB_USERNAME:-portfolio}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-secret}
    ports:
      - "${DB_PORT_FORWARD:-3307}:3306"
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root-secret}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [web]

  # Catches outgoing mail in development: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    networks: [web]

volumes:
  mysql:
  storage:
  public:

networks:
  web:
