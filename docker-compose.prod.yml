# Production compose for a VPS where:
#   - MySQL runs as its own container, managed by this stack (no manual install)
#   - the whole site (not just static assets) is proxied through a CDN edge
#
# Usage:
#   cp .env.example .env.prod   # fill in real values, see notes below
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.prod exec app php artisan db:seed --force
#
# MySQL's data lives in the `mysql` named volume below — it survives
# `docker compose down` and container rebuilds, but NOT `docker compose down -v`
# (that deletes the volume, and the database with it). Back it up regularly:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod exec mysql \
#     mysqldump -u root -p"$DB_ROOT_PASSWORD" portfolio > backup-$(date +%F).sql
#
# MySQL's port is intentionally NOT published to the host or the internet —
# only the `app` service can reach it, over the internal `web` network.
#
# TLS: this stack serves plain HTTP on :80 and expects the CDN to terminate
# TLS at the edge. If your CDN needs to re-encrypt to the origin (e.g.
# Cloudflare "Full (strict)"), add a 443 server block with real certs to
# docker/nginx/prod.conf, mount them below, and publish 443 too.
#
# Firewall: restrict inbound 80(/443) on this VPS to your CDN's published IP
# ranges. docker/nginx/prod.conf only decides which forwarded-IP headers
# nginx trusts — it does not stop direct connections that skip the CDN.

services:
  app:
    build:
      context: .
      target: runtime
    image: tofanidze-portfolio:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-portfolio}
      DB_USERNAME: ${DB_USERNAME:-portfolio}
      DB_PASSWORD: ${DB_PASSWORD:?set a real password in .env.prod}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      LOG_CHANNEL: daily
    volumes:
      - storage:/var/www/html/storage
    networks: [web]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      # - "443:443"          # only if this origin also terminates TLS — see notes above
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./docker/nginx/certs:/etc/nginx/certs:ro
    networks: [web]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-portfolio}
      MYSQL_USER: ${DB_USERNAME:-portfolio}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set a real password in .env.prod}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set a real root password in .env.prod}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [web]

volumes:
  mysql:
  storage:

networks:
  web:
