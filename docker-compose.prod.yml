# Production compose — runs on the EU Exit server in this chain:
#
#   Client -> Yandex Cloud CDN -> RU Origin (nginx + Xray XHTTP)
#             -> Xray/Reality -> THIS SERVER (EU): Xray exit + this stack
#
# This box is both the VPN's actual internet egress point (Xray Reality
# inbound, running outside this compose file — see
# docker/xray/eu-exit-config.json.example) and the host for the real "cover"
# website. MySQL runs as its own container here too (no manual install needed).
#
# Usage:
#   cp .env.example .env.prod   # fill in real values, see notes below
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.prod exec app php artisan db:seed --force
#
# MySQL's data lives in the `mysql` named volume below — it survives
# `docker compose down` and container rebuilds, but NOT `docker compose down -v`
# (that deletes the volume, and the database with it). Back it up regularly:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod exec mysql \
#     mysqldump -u root -p"$DB_ROOT_PASSWORD" portfolio > backup-$(date +%F).sql
#
# MySQL's port is intentionally NOT published to the host or the internet —
# only the `app` service can reach it, over the internal `web` network.
#
# nginx here binds ONLY to this server's WireGuard address (10.66.66.2) — not
# 127.0.0.1, and not the public interface. The only thing that can ever reach
# it is the RU Origin's edge nginx, over the private WireGuard link (see
# docker/wireguard/eu-exit-wg0.conf.example). Set up WireGuard on this host
# BEFORE starting this stack — the 10.66.66.2 address it binds to doesn't
# exist until the wg0 interface is up, and `docker compose up` will fail to
# bind the port otherwise. Full picture in the README's
# "Production: VPS behind a CDN, sharing a host with Xray/XHTTP" section.

services:
  app:
    build:
      context: .
      target: runtime
    image: tofanidze-portfolio:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-portfolio}
      DB_USERNAME: ${DB_USERNAME:-portfolio}
      DB_PASSWORD: ${DB_PASSWORD:?set a real password in .env.prod}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      LOG_CHANNEL: daily
    volumes:
      - storage:/var/www/html/storage
    networks: [web]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      # Bound to this server's WireGuard address only — reachable from the RU
      # Origin's edge nginx over the private wg0 link, not from the internet
      # and not even from this host's own public interface.
      - "10.66.66.2:8081:80"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [web]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-portfolio}
      MYSQL_USER: ${DB_USERNAME:-portfolio}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set a real password in .env.prod}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set a real root password in .env.prod}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [web]

volumes:
  mysql:
  storage:

networks:
  web:
