# Production compose for a VPS with:
#   - MySQL running locally on the host (not in a container)
#   - the whole site (not just static assets) proxied through a CDN edge
#
# Usage:
#   cp .env.example .env.prod   # fill in real values, see notes below
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.prod exec app php artisan db:seed --force
#
# Local MySQL setup (once, on the host):
#   - bind-address must cover the docker bridge, not just 127.0.0.1
#     (either 0.0.0.0 restricted by the host firewall to the docker subnet,
#     or the docker0 interface's own address)
#   - the DB user needs a host grant that matches, e.g.
#       CREATE USER 'portfolio'@'%' IDENTIFIED BY '...';
#       GRANT ALL ON portfolio.* TO 'portfolio'@'%';
#     ('%' can be narrowed to the docker bridge subnet, e.g. 172.16.0.0/12,
#     once you know it — 'localhost' will NOT match connections coming from
#     inside the app container, they arrive over the bridge network)
#
# TLS: this stack serves plain HTTP on :80 and expects the CDN to terminate
# TLS at the edge. If your CDN needs to re-encrypt to the origin (e.g.
# Cloudflare "Full (strict)"), add a 443 server block with real certs to
# docker/nginx/prod.conf, mount them below, and publish 443 too.
#
# Firewall: restrict inbound 80(/443) on this VPS to your CDN's published IP
# ranges. docker/nginx/prod.conf only decides which forwarded-IP headers
# nginx trusts — it does not stop direct connections that skip the CDN.

services:
  app:
    build:
      context: .
      target: runtime
    image: tofanidze-portfolio:latest
    restart: unless-stopped
    extra_hosts:
      # Lets the container reach MySQL on the host via DB_HOST=host.docker.internal.
      # Requires Docker Engine 20.10+ on Linux.
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      LOG_CHANNEL: daily
    volumes:
      - storage:/var/www/html/storage
    networks: [web]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      # - "443:443"          # only if this origin also terminates TLS — see notes above
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./docker/nginx/certs:/etc/nginx/certs:ro
    networks: [web]

volumes:
  storage:

networks:
  web:
