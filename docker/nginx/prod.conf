server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php;
    charset utf-8;

    client_max_body_size 20M;

    # ── Real client IP behind a CDN edge ────────────────────────────────────
    # The whole site is proxied through the CDN, so nginx is no longer the
    # first hop — $remote_addr would otherwise be the CDN's own edge IP for
    # every request. That breaks two things Laravel relies on: the contact
    # form's per-IP rate limiter (throttle:contact) and the IP address stored
    # on every contact_messages row.
    #
    # set_real_ip_from restricts WHO nginx believes when it sees a forwarded
    # IP header — only connections that actually originate from your CDN's
    # published edge ranges. Anyone else (e.g. a request that reaches this
    # VPS directly, bypassing the CDN) gets treated as the raw TCP peer,
    # which is exactly what you want: it makes the forwarded-IP header
    # unspoofable unless the request already came through the CDN.
    #
    # Fill in your provider's real range list below (from your CDN's own
    # dashboard/docs — Cloudflare, Fastly, Bunny and others each publish
    # theirs, and they change over time, so don't hardcode a copy here that
    # can go stale). Swap real_ip_header for CF-Connecting-IP if you're on
    # Cloudflare specifically — it's simpler than parsing X-Forwarded-For.
    #
    # set_real_ip_from 203.0.113.0/24;   # ← replace with your CDN's ranges
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;
    #
    # IMPORTANT: also firewall this VPS (ufw/iptables/security group) so
    # ports 80/443 only accept connections from your CDN's IP ranges. The
    # set_real_ip_from allowlist above only decides which headers nginx
    # trusts — it does not stop someone from connecting directly and
    # skipping the CDN (and the header-spoofing protection) entirely.

    # Sent even though this origin itself speaks plain HTTP to the CDN —
    # visitors' browsers only ever see the CDN edge, and that must be
    # HTTPS-only. Remove if your CDN is not yet serving HTTPS everywhere.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security headers. CSP is deliberately permissive about Google Fonts only.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { try_files $uri /index.php?$query_string; }

    # Hashed Vite assets never change under the same name.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Overwrite whatever forwarding headers arrived on the wire with
        # nginx's own, real_ip-resolved values. PHP must never see a
        # client- or CDN-supplied X-Forwarded-For / -Proto verbatim —
        # $remote_addr is already the validated one from the block above.
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;

        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        internal;
    }

    # Nothing else is allowed to execute PHP.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_page 404 /index.php;
}
