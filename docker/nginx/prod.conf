server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php;
    charset utf-8;

    client_max_body_size 20M;

    # ── Position in the chain ────────────────────────────────────────────────
    # This is the INNER nginx, running on the EU Exit server (docker-compose.prod.yml).
    # It is not the first hop from the internet, and not even on the same host
    # as the first hop: the RU Origin server's bare-metal edge nginx (see
    # docker/nginx/edge.conf.example) terminates TLS, talks to the CDN, resolves
    # the real visitor IP via its own real_ip_module config, and reverse-proxies
    # everything that isn't the VPN path to this container over a private
    # WireGuard link (RU 10.66.66.1 → this server's 10.66.66.2:8081 — see
    # docker/wireguard/*.conf.example and docker-compose.prod.yml).
    #
    # Because this container's port is published only on this server's
    # WireGuard address — reachable only from the RU Origin, over that private
    # link — the X-Forwarded-For / X-Forwarded-Proto headers it receives are
    # already correct. Do NOT override them with $remote_addr here: at this
    # hop $remote_addr is the RU Origin's WireGuard address, not the visitor's,
    # so doing that would make every request look like it came from 10.66.66.1
    # and silently break the contact form's per-IP rate limiter and the IP
    # stored on every contact_messages row. Just pass through what arrived —
    # nginx forwards client headers to fastcgi as HTTP_* params by default, no
    # extra directive needed.
    #
    # HSTS is intentionally set here rather than on the RU edge nginx: this
    # response reaches the browser unmodified through the whole chain's
    # proxy_pass hops, and every path to this container is already HTTPS by
    # the time a real visitor sees it (RU edge → CDN → client are all TLS;
    # RU → EU is WireGuard-encrypted rather than TLS, which is fine — it's a
    # private link between two servers you control, not client-facing).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security headers. CSP is deliberately permissive about Google Fonts only.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { try_files $uri /index.php?$query_string; }

    # Hashed Vite assets never change under the same name.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        internal;
    }

    # Nothing else is allowed to execute PHP.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_page 404 /index.php;
}
